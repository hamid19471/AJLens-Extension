<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Section Lens</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 300px;
        background: #0d1312;
        color: #f2f4ef;
        font:
          13px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      .wrap {
        padding: 14px 16px 16px;
        border: 1px solid #303a38;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .label {
        margin: 12px 0 4px;
        color: #d56d6d;
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
      .muted {
        margin-top: 10px;
        color: #9da7a3;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="icons/icon-32.png" width="18" height="18" alt="" />
        Section Lens
      </header>
      <div class="label">Unavailable on this page</div>
      <p id="reason" role="status">Section Lens cannot run on this page.</p>
      <p class="muted">Open a regular website (http/https) and click the toolbar icon again.</p>
    </div>
    <script src="notice.js"></script>
  </body>
</html>
