<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>AJ Lens</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 320px;
        background: #0d1312;
        color: #f2f4ef;
        font:
          13px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      html[dir='rtl'] body {
        font-family: Vazirmatn, 'Yekan Bakh', Tahoma, Arial, sans-serif;
      }
      .wrap {
        padding: 14px 16px 16px;
        border: 1px solid #303a38;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .label {
        margin: 12px 0 4px;
        color: #d56d6d;
        font-size: 11px;
        font-weight: 600;
      }
      html[dir='ltr'] .label {
        font-size: 10.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0;
        unicode-bidi: plaintext;
      }
      .muted {
        margin-top: 10px;
        color: #9da7a3;
        font-size: 12px;
      }
      #detail {
        margin-top: 8px;
        direction: ltr;
        unicode-bidi: isolate;
        text-align: left;
        color: #9da7a3;
        font:
          11px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        word-break: break-word;
      }
      #detail:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <img src="icons/icon-32.png" width="18" height="18" alt="" />
        <bdi dir="ltr">AJ Lens</bdi>
      </header>
      <div class="label" id="heading">در این صفحه در دسترس نیست</div>
      <p id="reason" role="status">
        AJ Lens نمی‌تواند در صفحات داخلی مرورگر یا فروشگاه Chrome اجرا شود. یک وب‌سایت معمولی را باز
        کنید و دوباره تلاش کنید.
      </p>
      <p class="muted" id="hint">
        یک وب‌سایت معمولی (http/https) را باز کنید و دوباره روی آیکون افزونه کلیک کنید.
      </p>
      <p id="detail"></p>
    </div>
    <script src="notice.js"></script>
  </body>
</html>
